[workspace]
resolver = "2"
members = [
    "crates/tuck-core",
    "crates/tuck-audit",
    "crates/tuck-gateway",
    "crates/tuck",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Jasonmilk/Tuck"
description = "Tuck: Helix ecosystem immune system — CI-144 PFP consumer, hard real-time security gate"

[workspace.dependencies]
# CI-144 BIND-19 reference implementation (PFP 4-byte type)
# TODO: publish to crates.io or use git dependency
# bind19 = { git = "https://github.com/CommonIntents/BIND-19", branch = "v2.0-alpha" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
thiserror = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Zeroize for credential memory zeroing
zeroize = { version = "1", features = ["derive"] }

# Async trait for CredentialStore
async-trait = "0.1"

# SHA-256 for audit chain
sha2 = "0.10"

# Ed25519 signature anchoring for audit chain (optional, feature-gated)
ed25519-dalek = { version = "2" }

# Gateway: HTTP/S typing (content governance host)
axum = { version = "0.8", features = ["json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
futures-util = "0.3"

# AES-GCM for credential encryption
aes-gcm = "0.10"

# Random number generation
rand = "0.8"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Testing
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
