[package]
name = "tuck"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tuck: Helix ecosystem immune system — CI-144 PFP consumer, hard real-time security gate"

[[bin]]
name = "tuck"
path = "src/main.rs"

[features]
default = []
# Content-governance gateway service (按需加载: only built when needed).
gateway = [
    "dep:tuck-gateway",
    "dep:tuck-audit",
    "dep:axum",
    "tuck-gateway/policy",
    "tuck-gateway/redact",
    "tuck-gateway/audit",
]

[dependencies]
tuck-core = { path = "../tuck-core" }
tuck-gateway = { path = "../tuck-gateway", optional = true }
tuck-audit = { path = "../tuck-audit", optional = true }
axum = { workspace = true, optional = true }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
clap = { version = "4", features = ["derive"] }
hex = "0.4"
