[package]
name = "tuck-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tuck content-governance gateway — OpenAI-compatible proxy, detection, policy, redaction"

[features]
default = []
# Inbound detection + policy matrix (mapping/guard/hold tables).
policy = []
# Semantic redaction (entity → placeholder mapping table).
redact = []
# Audit chain integration: every governed call lands in the tamper-evident
# ledger (request decision + response outcome, linked by trace id).
audit = ["dep:tuck-audit"]

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "net", "io-util", "macros", "sync"] }
axum.workspace = true
reqwest.workspace = true
futures-util.workspace = true
tracing.workspace = true
hmac.workspace = true
sha2.workspace = true
base64.workspace = true
tuck-audit = { path = "../tuck-audit", optional = true }
regex = "1.13.1"

[dev-dependencies]
tower = "0.5.3"
