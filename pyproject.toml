[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# ==============================================
# Tuck - AI 会话版本控制 | 时间穿梭 | 人格芯片
# 开源项目核心配置文件 (PEP 621)
# ==============================================
[project]
name = "tuck"
version = "1.0.0"
authors = [
    { name = "Jasonmilk" }
]
description = "AI Conversation Version Control + Time Travel + Multi-Model Gateway + Personas Chip"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = [
    "ai", "llm", "version-control", "time-travel", 
    "kv-cache", "personas", "ai-gateway", "openai-compatible"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# 核心依赖 (与项目代码完全对齐)
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "aiofiles>=24.1.0",
    "portalocker>=2.10.0",    # 核心文件锁，确保多进程安全
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.1",
    "typing-extensions>=4.12.0",
]

# ==============================================
# 全局 CLI 命令配置
# 安装后直接在终端输入 tuck 即可启动交互式菜单
# ==============================================
[project.scripts]
tuck = "tuck.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=24.0",
    "isort>=5.13"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tuck*"]
