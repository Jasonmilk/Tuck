[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# ==============================================
# Tuck - AI 会话版本控制 | 时间穿梭 | 人格芯片
# 开源项目核心配置文件
# ==============================================
[project]
name = "tuck"
version = "1.0.0"
authors = [
    { name = "Jason_milk"}
]
description = "AI Conversation Version Control + Time Travel + Multi-Model Gateway + Personas Chip"
long_description = file: "README.md"
long_description_content_type = "text/markdown"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = [
    "ai",
    "llm",
    "version-control",
    "time-travel",
    "kv-cache",
    "personas",
    "ai-gateway",
    "openai-compatible"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: Proxy Servers",
]

# 核心依赖（与 requirements.txt 完全同步）
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.32.1",
    "uvloop==0.19.0",
    "httpx==0.27.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.8.1",
    "aiofiles==24.1.0",
    "filelock==3.16.1",
    "python-multipart==0.0.12",
    "cryptography==43.0.1",
    "typing-extensions==4.12.2",
    "python-dotenv==1.0.1",
    "structlog==24.4.0",
    "colorlog==6.9.0"
]

# ==============================================
# 全局 CLI 命令配置
# 执行 pip install . 后，直接在终端输入 tuck 启动
# ==============================================
[project.scripts]
tuck = "tuck.cli:main"

# ==============================================
# 开发环境可选依赖（开发者专用，普通用户无需安装）
# ==============================================
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=24.0",
    "isort>=5.13",
    "flake8>=7.0",
    "pre-commit>=3.5"
]
